name: CI/CD Pipeline

on:
  push:
    branches: [ "test/v1.0.0", "prod/v1.0.0" ]
  pull_request:
    branches: [ "prod/v1.0.0" ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore MicroserviceProject.sln

      - name: Build solution
        run: dotnet build MicroserviceProject.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test MicroserviceProject.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/test/v1.0.0' || github.ref == 'refs/heads/prod/v1.0.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Auth API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/AuthService/Auth.API/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/microservice-auth:latest

      - name: Build & Push Product API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/ProductService/Product.API/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/microservice-product:latest

      - name: Build & Push Log API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/LogService/Log.API/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/microservice-log:latest

      - name: Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ApiGateway/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/microservice-gateway:latest
